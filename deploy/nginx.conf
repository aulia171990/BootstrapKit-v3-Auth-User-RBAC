# Production nginx config — Ojol Online
#
# Subdomain layout:
#   admin.ojol.example    → admin SPA (dist/)
#   passenger.ojol.example → passenger SPA (dist-passenger/)
#   api.ojol.example      → Laravel API + Reverb WS
#
# Adjust server_name, root paths, and SSL certs to match your domain.

# ── Admin tenant ─────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.ojol.example;
    root /var/www/ojol/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── Passenger tenant ──────────────────────────────────────────────
server {
    listen 80;
    server_name passenger.ojol.example;
    root /var/www/ojol/frontend/dist-passenger;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── API + WebSocket proxy ─────────────────────────────────────────
server {
    listen 80;
    server_name api.ojol.example;

    client_max_body_size 10M;

    # Laravel API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Broadcasting channel auth (HTTP POST)
    location /broadcasting/auth {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverb WebSocket (Pusher protocol)
    location /broadcasting {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # OpenAPI docs (served by Laravel)
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Health endpoints (served by Laravel, no auth)
    location /api/v1/health {
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/v1/ready {
        proxy_pass http://127.0.0.1:8000;
    }
}
